<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妙搭 Phase 0 能力探测</title>
<style>
  :root { --ok:#16a34a; --fail:#dc2626; --skip:#6b7280; --run:#2563eb; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #475569; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-size: 13px; color: #334155; }
  input[type=text] { width: 320px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button.primary { background: #2563eb; color: #fff; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .env { font-size: 12px; color: #475569; line-height: 1.8; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  th { background: #f1f5f9; color: #334155; font-weight: 600; white-space: nowrap; }
  td.detail { color: #64748b; font-size: 12px; max-width: 340px; word-break: break-all; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
  .badge.pass { background: var(--ok); } .badge.fail { background: var(--fail); }
  .badge.skip { background: var(--skip); } .badge.run { background: var(--run); }
  .summary { font-size: 13px; margin-left: auto; }
  .note { font-size: 12px; color: #94a3b8; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>妙搭 Phase 0 能力探测</h1>
  <div class="sub">同一页面：本机浏览器打开 = <b>基线</b>；放进妙搭运行时打开 = <b>平台实测</b>。两组数据的差值即平台限制。</div>

  <div class="card">
    <div class="row">
      <label>探测服务地址 <input type="text" id="baseUrl"></label>
      <label><input type="checkbox" id="quickMode" checked> 快速模式（跳过 &gt;10s 的长测）</label>
      <button class="primary" id="runAll">▶ 运行全部</button>
      <button class="ghost" id="copyJson">复制 JSON</button>
      <button class="ghost" id="dlJson">导出 JSON</button>
      <span class="summary" id="summary"></span>
    </div>
    <div class="note">完整模式约 3~4 分钟（含 60s 长连接与 60s 延迟阶梯）。建议本机基线先跑快速模式，妙搭实测至少完整跑一次。</div>
  </div>

  <div class="card">
    <div class="env" id="env"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>ID</th><th>测试项</th><th>结果</th><th>耗时</th><th>度量</th><th class="detail">备注</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
'use strict'
const $ = (s) => document.querySelector(s)
const state = { results: [], running: false }

const env = {
  href: location.href, origin: location.origin, ua: navigator.userAgent,
  dpr: devicePixelRatio, language: navigator.language, at: new Date().toISOString(),
}
const pathProbe = location.pathname.match(/^(.*\/probe)\/?$/)
$('#baseUrl').value = location.origin + (pathProbe ? pathProbe[1] : '')
$('#env').textContent = Object.entries(env).map(([k, v]) => `${k}: ${v}`).join('  |  ')

const apiUrl = (p) => $('#baseUrl').value.replace(/\/+$/, '') + p
const kb = (n) => n * 1024
const fmtBytes = (n) => n >= kb(1) ? (n / kb(1)).toFixed(1) + ' KB' : n + ' B'

/** fetch + ReadableStream 消费 SSE；统计事件数/字节数/首包延迟，并解析服务端 done 统计 */
async function fetchSSE({ path, method = 'GET', headers = {}, body = null, timeoutMs = 20000 }) {
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), timeoutMs)
  const t0 = performance.now()
  let firstChunkAt = 0
  try {
    const res = await fetch(apiUrl(path), { method, headers, body, signal: ctrl.signal, cache: 'no-store' })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    if (!res.body) throw new Error('res.body 为空（不支持流式读取）')
    const reader = res.body.getReader()
    const dec = new TextDecoder()
    let buf = '', events = 0, bytes = 0, doneData = null
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      if (!firstChunkAt) firstChunkAt = performance.now()
      bytes += value.length
      buf += dec.decode(value, { stream: true })
      let idx
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2)
        const ev = { event: 'message', data: '' }
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) ev.event = line.slice(6).trim()
          else if (line.startsWith('data:')) ev.data += line.slice(5).trim()
        }
        if (ev.event === 'done') { try { doneData = JSON.parse(ev.data) } catch {} }
        events++
      }
    }
    return { events, bytes, doneData, ttfbMs: Math.round(firstChunkAt - t0), ms: Math.round(performance.now() - t0) }
  } finally { clearTimeout(timer) }
}

/** 原生 EventSource 消费 GET SSE */
function esTest(path, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const es = new EventSource(apiUrl(path))
    let events = 0
    const timer = setTimeout(() => { es.close(); reject(new Error('超时（' + timeoutMs + 'ms 内未收到 done）')) }, timeoutMs)
    es.addEventListener('probe', () => events++)
    es.addEventListener('done', (e) => { clearTimeout(timer); es.close(); resolve({ events }) })
    es.onerror = () => { clearTimeout(timer); es.close(); reject(new Error('EventSource 触发 onerror（连接被拒/被掐断）')) }
  })
}

async function jsonGet(path, timeoutMs = 60000) {
  const res = await fetch(apiUrl(path), { cache: 'no-store', signal: AbortSignal.timeout(timeoutMs) })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const t0 = performance.now()
  const text = await res.text()
  return { text, bytes: new TextEncoder().encode(text).length, ms: Math.round(performance.now() - t0) }
}

/** 测试矩阵：id 与 CHECKLIST.md 的 B 组编号一一对应 */
const TESTS = [
  { id: 'B1', name: 'EventSource 原生 SSE（GET）', run: async () => {
      const r = await esTest('/api/sse/quick')
      return { metric: `收到 ${r.events} 个事件`, detail: '浏览器原生 EventSource 可用' } } },
  { id: 'B2', name: 'fetch + ReadableStream 流式（POST）', run: async () => {
      const r = await fetchSSE({ path: '/api/sse/quick', method: 'POST', body: JSON.stringify({ probe: 1 }),
        headers: { 'Content-Type': 'application/json' } })
      return { metric: `${r.events} 事件 / 首包 ${r.ttfbMs}ms`, detail: 'POST 流式读取可用于 chat SSE' } } },
  { id: 'B3', name: 'SSE 短连接（10 事件×100ms）', run: async () => {
      const r = await fetchSSE({ path: '/api/sse/quick' })
      if (r.events < 11) throw new Error(`事件数不足：${r.events}`)
      return { metric: `${r.events} 事件 / ${fmtBytes(r.bytes)} / 首包 ${r.ttfbMs}ms`, detail: JSON.stringify(r.doneData) } } },
  { id: 'B4', name: 'SSE 长连接保持 60s（心跳）', long: true, run: async () => {
      const r = await fetchSSE({ path: '/api/sse/long?secs=60&interval=1000', timeoutMs: 90000 })
      if (!r.doneData) throw new Error('未收到 done（连接中途被掐断）')
      return { metric: `存活 ${Math.round(r.ms / 1000)}s / ${r.events} 事件`, detail: JSON.stringify(r.doneData) } } },
  { id: 'B5', name: 'SSE 大载荷流式 1MB', long: true, run: async () => {
      const r = await fetchSSE({ path: '/api/sse/large?kb=1024&events=32', timeoutMs: 90000 })
      if (r.bytes < kb(900)) throw new Error(`仅收到 ${fmtBytes(r.bytes)}`)
      return { metric: `流式接收 ${fmtBytes(r.bytes)}`, detail: JSON.stringify(r.doneData) } } },
  ...[100, 512, 1024, 2048, 4096].map((n) => ({
    id: 'B6-' + (n < 1024 ? n + 'KB' : n / 1024 + 'MB'), name: `JSON 响应体积 ${n < 1024 ? n + ' KB' : n / 1024 + ' MB'}`, long: n >= 2048,
    run: async () => {
      const r = await jsonGet('/api/json/size?kb=' + n, 90000)
      if (r.bytes < kb(n) * 0.9) throw new Error(`实际仅 ${fmtBytes(r.bytes)}（被截断）`)
      return { metric: `完整接收 ${fmtBytes(r.bytes)} / ${r.ms}ms` }
    } })),
  ...[5000, 15000, 30000, 60000].map((ms) => ({
    id: 'B7-' + ms / 1000 + 's', name: `请求延迟 ${ms / 1000}s 后响应`, long: ms >= 30000,
    run: async () => {
      const r = await jsonGet('/api/delay?ms=' + ms, ms + 30000)
      return { metric: `等待 ${ms / 1000}s 后成功收到响应`, detail: `实际耗时 ${r.ms}ms` }
    } })),
  { id: 'B8', name: 'chunked 分块传输编码', run: async () => {
      const r = await fetchSSE({ path: '/api/chunk?n=20&gap=200', timeoutMs: 30000 }).catch(async () => null)
      if (r) return { metric: `按流读取成功（${fmtBytes(r.bytes)}）` }
      const j = await jsonGet('/api/chunk?n=20&gap=200', 30000)
      const arr = JSON.parse(j.text)
      if (!Array.isArray(arr) || arr.length !== 20) throw new Error('分片数据不完整')
      return { metric: '整体接收成功（20 块）', detail: '未走流式读取，仍可解析完整 JSON' } } },
  { id: 'B9', name: '自定义 Header 透传（Authorization/X-Probe）', run: async () => {
      const res = await fetch(apiUrl('/api/echo'), { method: 'POST', headers: { Authorization: 'Bearer phase0-token', 'X-Probe': 'miaoda' },
        body: JSON.stringify({ a: 1 }), signal: AbortSignal.timeout(20000) })
      const j = await res.json()
      if (j.echoHeaders?.authorization !== 'Bearer phase0-token' || j.echoHeaders?.['x-probe'] !== 'miaoda')
        throw new Error('Header 未到达服务端：' + JSON.stringify(j.echoHeaders))
      return { metric: '两个自定义 Header 均到达服务端', detail: '数据请求携带鉴权头可行' } } },
  { id: 'B10-100KB', name: 'POST JSON 请求体 100KB', run: async () => {
      const res = await fetch(apiUrl('/api/echo'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pad: 'x'.repeat(kb(100)) }), signal: AbortSignal.timeout(30000) })
      const j = await res.json()
      if ((j.body?.size || 0) < kb(90)) throw new Error('请求体被截断：' + j.body?.size)
      return { metric: `服务端完整收到 ${fmtBytes(j.body.size)}` } } },
  { id: 'B10-1MB', name: 'POST JSON 请求体 1MB', long: true, run: async () => {
      const res = await fetch(apiUrl('/api/echo'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pad: 'x'.repeat(kb(1024)) }), signal: AbortSignal.timeout(60000) })
      const j = await res.json()
      if ((j.body?.size || 0) < kb(900)) throw new Error('请求体被截断：' + j.body?.size)
      return { metric: `服务端完整收到 ${fmtBytes(j.body.size)}` } } },
  { id: 'B11', name: '5 路并发 SSE 同时保持', run: async () => {
      const rs = await Promise.all(Array.from({ length: 5 }, () => fetchSSE({ path: '/api/sse/quick', timeoutMs: 30000 })))
      const bad = rs.filter((r) => r.events < 11).length
      if (bad) throw new Error(`${bad}/5 路事件数不足`)
      return { metric: `5 路全部成功，最慢 ${Math.max(...rs.map((r) => r.ms))}ms` } } },
  { id: 'B12', name: '跨域 CORS 预检（OPTIONS）', run: async () => {
      const sameOrigin = new URL(apiUrl('/')).origin === location.origin
      const res = await fetch(apiUrl('/api/echo'), { method: 'POST', headers: { 'X-Probe': 'cors' },
        body: '{}', signal: AbortSignal.timeout(20000) })
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return { metric: '带自定义头的跨域请求成功', detail: sameOrigin ? '当前同源，仅作记录；跨域时此结果才有判定意义' : '真跨域场景，结果有效' } } },
]

function renderRow(t, status, ms, metric, detail) {
  let tr = document.getElementById('tr-' + t.id)
  if (!tr) {
    tr = document.createElement('tr'); tr.id = 'tr-' + t.id
    tr.innerHTML = `<td>${t.id}</td><td>${t.name}</td><td class="st"></td><td class="ms"></td><td class="mc"></td><td class="detail dt"></td>`
    $('#tbody').appendChild(tr)
  }
  tr.querySelector('.st').innerHTML = `<span class="badge ${status}">${{ pass: '通过', fail: '失败', skip: '跳过', run: '运行中' }[status]}</span>`
  tr.querySelector('.ms').textContent = ms != null ? ms + 'ms' : ''
  tr.querySelector('.mc').textContent = metric || ''
  tr.querySelector('.dt').textContent = detail || ''
}

function updateSummary() {
  const c = { pass: 0, fail: 0, skip: 0 }
  state.results.forEach((r) => c[r.status]++)
  $('#summary').textContent = `通过 ${c.pass} / 失败 ${c.fail} / 跳过 ${c.skip}`
}

async function runAll() {
  if (state.running) return
  state.running = true; state.results = []
  $('#runAll').disabled = true
  const quick = $('#quickMode').checked
  for (const t of TESTS) {
    if (quick && t.long) {
      renderRow(t, 'skip', null, '', '快速模式跳过（完整模式至少跑一次）')
      state.results.push({ id: t.id, name: t.name, status: 'skip', ms: null })
      updateSummary(); continue
    }
    renderRow(t, 'run')
    const t0 = performance.now()
    try {
      const r = await t.run()
      const ms = Math.round(performance.now() - t0)
      renderRow(t, 'pass', ms, r.metric, r.detail)
      state.results.push({ id: t.id, name: t.name, status: 'pass', ms, metric: r.metric, detail: r.detail })
    } catch (err) {
      const ms = Math.round(performance.now() - t0)
      const msg = String(err?.message || err)
      renderRow(t, 'fail', ms, '', msg)
      state.results.push({ id: t.id, name: t.name, status: 'fail', ms, error: msg })
    }
    updateSummary()
  }
  state.running = false
  $('#runAll').disabled = false
  $('#runAll').textContent = '▶ 重新运行'
}

function exportJson() {
  return JSON.stringify({
    generatedAt: new Date().toISOString(),
    env, config: { baseUrl: $('#baseUrl').value, quickMode: $('#quickMode').checked },
    results: state.results,
  }, null, 2)
}

$('#runAll').addEventListener('click', runAll)
$('#dlJson').addEventListener('click', () => {
  const blob = new Blob([exportJson()], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'phase0-results-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json'
  a.click(); URL.revokeObjectURL(a.href)
})
$('#copyJson').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(exportJson()); $('#copyJson').textContent = '已复制 ✓' }
  catch { $('#copyJson').textContent = '复制失败（用导出）' }
  setTimeout(() => ($('#copyJson').textContent = '复制 JSON'), 1500)
})
TESTS.forEach((t) => renderRow(t, 'skip', null, '', '待运行'))
</script>
</body>
</html>
